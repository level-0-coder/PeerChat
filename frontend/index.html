<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<title>PeerChat</title>
		<meta name="viewport" value="width=device-width, initial-scale=1.0" >
		<link rel="stylesheet" href="main.css">
	</head>
	<body>
		<h1>Peerchat</h1>
		<p id="roomId"></p>
		<div id="videos">
			<video class="video-player" id="user-1" autoplay playsinline></video>
			<video class="video-player" id="user-2" autoplay playsinline></video>
		</div>
		<input id="roomCode" type="text" placeholder="Enter the Room code">
		<button id="connect">Connect</button>
		<button id="create">Create</button>
		<pre id="log" style="border: 1px solid black; width: 80%; margin: 8px; min-height: 200px;"></pre>
	</body>
	<script src="main.js"></script>
</html>
